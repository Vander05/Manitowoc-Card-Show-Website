backend:
  name: git-gateway
  repo: Vander05/Manitowoc-Card-Show-Website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/a9a6a4e4-6a10-440e-9aa1-3233fec206bd/pkce
  auth_token_endpoint: /sites/a9a6a4e4-6a10-440e-9aa1-3233fec206bd/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

site_url: https://manitowoccardshow.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "Show details"
    files:
      - name: "settings"
        label: "Site content"
        file: "content/site.json"
        fields:
          - label: "Event"
            name: "event"
            widget: "object"
            fields:
              - { label: "Date", name: "date_label", widget: "string" }
              - { label: "Hours", name: "hours_label", widget: "string" }
              - { label: "Admission", name: "admission_label", widget: "string" }
              - { label: "Parking", name: "parking_label", widget: "string" }
              - { label: "Food and drink", name: "food_label", widget: "string" }
              - { label: "Vendor load-in note", name: "loadin_label", widget: "string" }
          - label: "Vendors"
            name: "vendors"
            widget: "object"
            fields:
              - { label: "Total tables", name: "total_tables", widget: "number", value_type: "int" }
              - { label: "Tables reserved so far", name: "reserved_tables", widget: "number", value_type: "int" }
              - { label: "Price per table", name: "price_per_table", widget: "string" }
              - label: "Contacts"
                name: "contacts"
                widget: "list"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "Email", name: "email", widget: "string", required: false }
                  - { label: "Phone", name: "phone", widget: "string", required: false }
          - label: "Gallery photos"
            name: "gallery"
            widget: "list"
            fields:
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }
